name: Verifica video su Instagram

# Solo manuale: crea contenitori per controllare i file, senza pubblicare nulla.
on:
  workflow_dispatch:
    inputs:
      filtro:
        description: Parte dell'identificativo da controllare (vuoto per tutti)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controllo dei contenitori
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FILTRO: ${{ inputs.filtro }}
        run: node src/verifica-media.js
